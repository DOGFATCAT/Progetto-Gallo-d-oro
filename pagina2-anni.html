<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallo d'Oro di Petriano — Scegli l'edizione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<noscript><style>body{opacity:1 !important;} .reveal{opacity:1 !important;transform:none !important;}</style></noscript>
</head>
<body>
<div class="app">
  <div id="nav-slot"></div>

  <div class="page-head reveal">
    <h2>Scegli l'edizione</h2>
    <p>Ogni biglietto è un'annata del Festival. Selezionane una per rivedere le foto e aiutarci a riconoscere chi c'è nello scatto.</p>
  </div>

  <div class="search-wrap reveal">
    <div class="search-row">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="year-search" type="text" inputmode="numeric" placeholder="Cerca un anno, es. 1998" oninput="filterYears(this.value)">
      <button id="search-clear-btn" class="search-clear" style="display:none;" onclick="clearYearSearch()" aria-label="Cancella ricerca">✕</button>
    </div>
  </div>

  <div id="demo-banner-slot"></div>

  <div class="year-grid" id="year-grid"></div>
  <p class="rank-empty" id="no-results" style="display:none; padding:20px 0;"></p>

  <footer>Festival Gallo d'Oro · Gallo di Petriano (PU) · dal 1966</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="script.js"></script>
<script>
  mountNav('anni');
  mountCartWidget();
  mountLegalNotice();

  const grid = document.getElementById('year-grid');
  const bannerSlot = document.getElementById('demo-banner-slot');

  (async function initYears(){
    const visibleYears = await getVisibleYears();
    const yearsToShow = visibleYears || YEARS;

    if (!visibleYears) {
      bannerSlot.innerHTML = `<div class="demo-banner reveal"><b>Nota:</b> non hai ancora impostato quali edizioni esistono davvero, quindi qui sotto vedi tutti gli anni dal 1966 al 2026 come demo. Vai nella pagina admin per selezionare solo gli anni in cui il Festival si è davvero svolto.</div>`;
    }

    grid.innerHTML = yearsToShow.map((y, i) => `
      <a class="year-card reveal" data-year="${y}" href="pagina3-foto.html?anno=${y}" style="transition-delay:${(i % 10) * 45}ms;">
        <span class="yc-shine" aria-hidden="true"></span>
        <div class="yc-eyebrow">Ingresso · Piazza Cavour</div>
        <div class="yc-year">${y}</div>
        <div class="yc-sub">EDIZIONE · ${y} · GALLO DI PETRIANO</div>
      </a>
    `).join('');

    initScrollReveal();
    initYearCardTilt();
  })();

  function filterYears(query){
    const q = query.trim();
    document.getElementById('search-clear-btn').style.display = q ? 'inline-block' : 'none';
    const cards = grid.querySelectorAll('.year-card');
    let visibleCount = 0;
    cards.forEach(t => {
      const match = !q || t.dataset.year.includes(q);
      t.style.display = match ? '' : 'none';
      if (match) visibleCount++;
    });
    const noResults = document.getElementById('no-results');
    if (visibleCount === 0 && q) {
      noResults.textContent = `Nessuna edizione trovata per "${q}".`;
      noResults.style.display = 'block';
    } else {
      noResults.style.display = 'none';
    }
  }

  function clearYearSearch(){
    const input = document.getElementById('year-search');
    input.value = '';
    filterYears('');
    input.focus();
  }
</script>
</body>
</html>
